<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Irrigation</title><style>body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px;text-align:center}h1{color:#1b5e20}.card{background:#fff;border-radius:12px;padding:15px;margin:12px auto;max-width:420px;box-shadow:0 2px 8px #ccc}button{padding:12px 20px;border:none;border-radius:8px;font-size:16px;margin:5px;cursor:pointer}.on{background:#2e7d32;color:#fff}.off{background:#c62828;color:#fff}.check{background:#1565c0;color:#fff}.lang{position:fixed;top:10px;right:10px;background:#fff;border:1px solid #999;padding:8px 12px;border-radius:20px}</style></head><body>
<button class="lang" id="langBtn" onclick="toggleLang()">Telugu</button>
<h1 id="title">Smart Irrigation System</h1>
<p id="sub">Based on Soil Moisture, Temperature and Humidity</p>
<div class="card"><h3 id="wTitle">Weather - Hyderabad</h3><p id="wVal">31°C, Sunny</p></div>
<div class="card"><h3 id="sTitle">Soil Status</h3><p id="soilVal">Wet - No Water Needed</p><p><span id="mLabel">Motor: </span><b id="motorVal">OFF</b></p><button class="on" id="onBtn" onclick="motorOn()">Motor ON</button><button class="off" id="offBtn" onclick="motorOff()">Motor OFF</button><br><button class="check" id="checkBtn" onclick="checkSoil()">Check Soil Now</button></div>
<div class="card"><h3 id="lTitle">Live Values</h3><p>Soil Moisture: <b id="moist">65%</b></p><p>Temperature: <b id="temp">31°C</b></p><p>Humidity: <b id="hum">45%</b></p></div>
<script>
let telugu=false;
let t={title:["Smart Irrigation System","స్మార్ట్ ఇరిగేషన్ సిస్టమ్"],sub:["Based on Soil Moisture, Temperature and Humidity","నేల తేమ, ఉష్ణోగ్రత మరియు తేమ ఆధారంగా"],wTitle:["Weather - Hyderabad","వాతావరణం - హైదరాబాద్"],sTitle:["Soil Status","నేల స్థితి"],mTitle:["Motor: ","మోటార్: "],onBtn:["Motor ON","మోటార్ ఆన్"],offBtn:["Motor OFF","మోటార్ ఆఫ్"],checkBtn:["Check Soil Now","నేలను ఇప్పుడు చెక్ చేయండి"],lTitle:["Live Values","ప్రత్యక్ష విలువలు"]};
function toggleLang(){telugu=!telugu;document.getElementById('title').innerText=t.title[telugu?1:0];document.getElementById('sub').innerText=t.sub[telugu?1:0];document.getElementById('wTitle').innerText=t.wTitle[telugu?1:0];document.getElementById('sTitle').innerText=t.sTitle[telugu?1:0];document.getElementById('mLabel').innerText=t.mTitle[telugu?1:0];document.getElementById('onBtn').innerText=t.onBtn[telugu?1:0];document.getElementById('offBtn').innerText=t.offBtn[telugu?1:0];document.getElementById('checkBtn').innerText=t.checkBtn[telugu?1:0];document.getElementById('lTitle').innerText=t.lTitle[telugu?1:0];document.getElementById('langBtn').innerText=telugu?"English":"Telugu";updateSoil();}
function updateSoil(){let m=parseInt(document.getElementById('moist').innerText);let s=document.getElementById('soilVal');if(m>50){s.innerText=telugu?"తడి - నీరు అవసరం లేదు":"Wet - No Water Needed";}else{s.innerText=telugu?"పొడి - నీరు అవసరం":"Dry - Water Needed";}}
function motorOn(){document.getElementById('motorVal').innerText=telugu?"ఆన్":"ON";}
function motorOff(){document.getElementById('motorVal').innerText=telugu?"ఆఫ్":"OFF";}
function checkSoil(){let m=Math.floor(Math.random()*40)+40;document.getElementById('moist').innerText=m+"%";updateSoil();}
</script></body></html>
