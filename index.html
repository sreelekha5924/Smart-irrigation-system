<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Irrigation</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px}
.card{background:white;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #ccc}
h1{text-align:center;color:#1b5e20}
.btn{padding:12px 20px;border:none;border-radius:10px;font-size:16px;width:100%;margin:5px 0;cursor:pointer}
.green{background:#2e7d32;color:white}.blue{background:#1565c0;color:white}.grey{background:#757575;color:white}
.top{display:flex;justify-content:space-between;align-items:center}
#langBtn{background:#ff9800;color:white;border:none;padding:8px 14px;border-radius:20px}
</style>
</head>
<body>
<div class="top"><b>🌱 Smart Irrigation</b><button id="langBtn" onclick="toggleLang()">Telugu</button></div>
<h1 id="title">Smart Irrigation System</h1>
<p style="text-align:center" id="subtitle">Automatic Watering Using Soil Moisture</p>

<div class="card"><h3 id="wTitle">🌦 Weather</h3><p id="wText">Hyderabad: 31°C, Sunny</p></div>
<div class="card"><h3 id="sTitle">🌱 Soil Status</h3><h2 id="soilVal">WET - No Water Needed</h2><p id="soilDesc">Moisture: 78%</p><p id="mTitle">Motor: <b id="motorVal">OFF</b></p></div>
<div class="card">
<button class="btn green" onclick="checkSoil()" id="checkBtn">Check Soil Now</button>
<button class="btn blue" onclick="motorOn()" id="onBtn">Motor ON</button>
<button class="btn grey" onclick="motorOff()" id="offBtn">Motor OFF</button>
</div>
<script>
let telugu=false;
let t={
title:["Smart Irrigation System","స్మార్ట్ ఇరిగేషన్ సిస్టమ్"],
subtitle:["Automatic Watering Using Soil Moisture","నేల తేమ ఆధారంగా ఆటోమేటిక్ నీరు"],
wTitle:["🌦 Weather","🌦 వాతావరణం"],
wText:["Hyderabad: 31°C, Sunny","హైదరాబాద్: 31°C, ఎండ"],
sTitle:["🌱 Soil Status","🌱 నేల స్థితి"],
checkBtn:["Check Soil Now","నేలను ఇప్పుడు చెక్ చేయండి"],
onBtn:["Motor ON","మోటార్ ఆన్"],
offBtn:["Motor OFF","మోటార్ ఆఫ్"],
mTitle:["Motor: ","మోటార్: "]
};
function toggleLang(){
telugu=!telugu;
document.getElementById('title').innerText=t.title[telugu?1:0];
document.getElementById('subtitle').innerText=t.subtitle[telugu?1:0];
document.getElementById('wTitle').innerText=t.wTitle[telugu?1:0];
document.getElementById('wText').innerText=t.wText[telugu?1:0];
document.getElementById('sTitle').innerText=t.sTitle[telugu?1:0];
document.getElementById('checkBtn').innerText=t.checkBtn[telugu?1:0];
document.getElementById('onBtn').innerText=t.onBtn[telugu?1:0];
document.getElementById('offBtn').innerText=t.offBtn[telugu?1:0];
document.getElementById('langBtn').innerText=telugu?"English":"Telugu";
updateSoilText();
}
let wet=true;
function updateSoilText(){
if(wet){
document.getElementById('soilVal').innerText=telugu?"తడి - నీరు అవసరం లేదు":"WET - No Water Needed";
document.getElementById('soilDesc').innerText=telugu?"తేమ: 78%":"Moisture: 78%";
document.getElementById('motorVal').innerText=telugu?"ఆఫ్":"OFF";
}else{
document.getElementById('soilVal').innerText=telugu?"పొడి - నీరు అవసరం":"DRY - Water Needed";
document.getElementById('soilDesc').innerText=telugu?"తేమ: 25%":"Moisture: 25%";
document.getElementById('motorVal').innerText=telugu?"ఆన్":"ON";
}}
function checkSoil(){wet=!wet;updateSoilText();}
function motorOn(){wet=false;updateSoilText();}
function motorOff(){wet=true;updateSoilText();}
</script>
</body>
</html>
